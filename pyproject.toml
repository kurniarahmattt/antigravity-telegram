[project]
name = "antigravity-telegram"
version = "0.1.0"
description = "Telegram bot wrapper for the Antigravity CLI (agy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.0",
    "aiosqlite>=0.21.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=25.0.0",
]

[project.scripts]
agy-telegram-bot = "agytg.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
